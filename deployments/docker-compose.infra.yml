services:
  # PostgreSQL - User & Auth Metadata
  postgres:
    image: postgres:16-alpine
    container_name: chat-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: chat_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - chat-network

  # Redis - Presence Service & Idempotency Cache
  redis:
    image: redis:7-alpine
    container_name: chat-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - chat-network

  # Apache Cassandra - High-throughput Message Store
  cassandra:
    image: cassandra:5.0
    container_name: chat-cassandra
    environment:
      - CASSANDRA_CLUSTER_NAME=chat_cluster
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_RACK=rack1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - MAX_HEAP_SIZE=1024M
      - HEAP_NEWSIZE=256M
    ports:
      - "9042:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - chat-network


  # NATS Server with JetStream enabled
  nats:
    image: nats:latest
    container_name: chat-nats
    ports:
      - "4222:4222" # Client port
      - "8222:8222" # HTTP Monitoring dashboard
    command: ["-js", "-m", "8222"]
    volumes:
      - nats_data:/data
    networks:
      - chat-network

networks:
  chat-network:
    name: chat-network
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  cassandra_data:
  nats_data:
