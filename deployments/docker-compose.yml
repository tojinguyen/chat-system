services:
  # Api Service (NestJS)
  api-service:
    build:
      context: ../services/api-service
      dockerfile: Dockerfile
    container_name: chat_api_service
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgrespassword
      - DB_DATABASE=chat_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=supersecretkey
    networks:
      - chat-network

  # WebSocket Gateway
  ws-gateway:
    build:
      context: ../services/ws-gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    networks:
      - chat-network

  # Chat Worker
  chat-worker:
    build:
      context: ../services/chat-worker
      dockerfile: Dockerfile
    networks:
      - chat-network

  # Notification Service
  notification-service:
    build:
      context: ../services/notification-service
      dockerfile: Dockerfile
    networks:
      - chat-network

networks:
  chat-network:
    driver: bridge
