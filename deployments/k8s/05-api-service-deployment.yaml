apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
  namespace: chat-system
  labels:
    app: api-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-service
  template:
    metadata:
      labels:
        app: api-service
    spec:
      containers:
        - name: api-service
          image: chat-system/api-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: DB_HOST
              value: "postgres.chat-system.svc.cluster.local"
            - name: DB_PORT
              value: "5432"
            - name: DB_USERNAME
              value: "postgres"
            - name: DB_PASSWORD
              value: "postgrespassword"
            - name: DB_DATABASE
              value: "chat_db"
            - name: REDIS_HOST
              value: "redis.chat-system.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: chat-secrets
                  key: JWT_ACCESS_TOKEN_SECRET
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "1000m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: chat-system
spec:
  type: ClusterIP
  selector:
    app: api-service
  ports:
    - name: http
      port: 3000
      targetPort: 3000

