apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-agent
  namespace: chat-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-agent
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - services
      - endpoints
      - pods
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-agent
subjects:
  - kind: ServiceAccount
    name: prometheus-agent
    namespace: chat-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-agent-config
  namespace: chat-system
data:
  prometheus.yml: |
    global:
      scrape_interval: 2s
      scrape_timeout: 2s

    remote_write:
      - url: "http://host.docker.internal:9090/api/v1/write"

    scrape_configs:
      - job_name: 'ws-gateway'
        static_configs:
          - targets:
              - 'ws-gateway-0.ws-gateway-headless.chat-system.svc.cluster.local:9091'
              - 'ws-gateway-1.ws-gateway-headless.chat-system.svc.cluster.local:9091'
              - 'ws-gateway-2.ws-gateway-headless.chat-system.svc.cluster.local:9091'

      - job_name: 'chat-engine'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - chat-system
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: chat-engine
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-agent
  namespace: chat-system
  labels:
    app: prometheus-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus-agent
  template:
    metadata:
      labels:
        app: prometheus-agent
    spec:
      serviceAccountName: prometheus-agent
      containers:
        - name: prometheus-agent
          image: prom/prometheus:v2.54.1
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.agent.path=/prometheus-data"
            - "--enable-feature=agent"
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: storage
              mountPath: /prometheus-data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: prometheus-agent-config
        - name: storage
          emptyDir: {}
