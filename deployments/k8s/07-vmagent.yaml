apiVersion: v1
kind: ServiceAccount
metadata:
  name: vmagent
  namespace: chat-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vmagent
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - services
      - endpoints
      - pods
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vmagent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vmagent
subjects:
  - kind: ServiceAccount
    name: vmagent
    namespace: chat-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vmagent-config
  namespace: chat-system
data:
  scrape.yaml: |
    global:
      scrape_interval: 2s
      scrape_timeout: 2s

    scrape_configs:
      - job_name: 'ws-gateway'
        static_configs:
          - targets:
              - 'ws-gateway-0.ws-gateway-headless.chat-system.svc.cluster.local:9091'
              - 'ws-gateway-1.ws-gateway-headless.chat-system.svc.cluster.local:9091'
              - 'ws-gateway-2.ws-gateway-headless.chat-system.svc.cluster.local:9091'

      - job_name: 'chat-engine'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - chat-system
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: chat-engine
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmagent
  namespace: chat-system
  labels:
    app: vmagent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vmagent
  template:
    metadata:
      labels:
        app: vmagent
    spec:
      serviceAccountName: vmagent
      containers:
        - name: vmagent
          image: victoriametrics/vmagent:v1.102.1
          args:
            - "-promscrape.config=/etc/vmagent/scrape.yaml"
            - "-remoteWrite.url=http://host.docker.internal:8428/api/v1/write"
            - "-remoteWrite.tmpDataPath=/vmagent-data"
          volumeMounts:
            - name: config
              mountPath: /etc/vmagent
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: vmagent-config
